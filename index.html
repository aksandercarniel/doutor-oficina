<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velocímetro Doxcore — mock (0/5 dentro)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --navy:#0d1f3c; --muted:#6b7a99; --muted2:#9aa5be;
  --font:'Plus Jakarta Sans',sans-serif; --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--navy);
  font-family:var(--font-body);display:flex;align-items:center;justify-content:center;padding:32px}
.card{background:var(--card);border-radius:20px;padding:26px 28px 22px;width:100%;max-width:380px;
  box-shadow:0 8px 30px rgba(13,31,60,.08);display:flex;flex-direction:column;align-items:center;gap:18px}
.card h1{font-family:var(--font);font-weight:700;font-size:16px;color:var(--navy);margin:0;letter-spacing:.2px}
.velo{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.velo-word{font-family:var(--font);font-weight:700;line-height:1;margin-bottom:2px;letter-spacing:.2px}
.velo svg{display:block}
.velo-score{font-family:var(--font);font-weight:600;color:var(--navy);margin-top:4px;line-height:1}
.ctrl{display:flex;align-items:center;gap:12px;width:100%}
.ctrl label{font-size:13px;color:var(--muted);font-weight:500}
.ctrl input[type=range]{flex:1;accent-color:var(--navy);height:4px}
.ctrl .val{font-family:var(--font);font-weight:700;font-size:14px;min-width:42px;text-align:right;color:var(--navy)}
</style>
</head>
<body>
<div class="card">
<h1>Velocímetro Doxcore</h1>
<div id="velo" class="velo"></div>
<div class="ctrl">
<label for="sld">Nota</label>
<input id="sld" type="range" min="0" max="5" step="0.1" value="4.2"/>
<span class="val" id="sldv">4,2</span>
</div>
</div>
<script>
(function(){
  const STATES=[
    {w:'Péssimo',d:'#b03537'},{w:'Ruim',d:'#b86d0d'},{w:'Regular',d:'#8a5d12'},
    {w:'Bom',d:'#5e8a2d'},{w:'Ótimo',d:'#4f7c1b'}
  ];
  const slices=[
    {d:'M 15.0,110.0 A 95,95 0 0 1 33.14,54.16 L 69.55,80.61 A 50,50 0 0 0 60.0,110.0 Z',fill:'#E24B4A'},
    {d:'M 33.14,54.16 A 95,95 0 0 1 80.64,19.65 L 94.55,62.45 A 50,50 0 0 0 69.55,80.61 Z',fill:'#EF9F27'},
    {d:'M 80.64,19.65 A 95,95 0 0 1 139.36,19.65 L 125.45,62.45 A 50,50 0 0 0 94.55,62.45 Z',fill:'#FAC775'},
    {d:'M 139.36,19.65 A 95,95 0 0 1 186.86,54.16 L 150.45,80.61 A 50,50 0 0 0 125.45,62.45 Z',fill:'#97C459'},
    {d:'M 186.86,54.16 A 95,95 0 0 1 205.0,110.0 L 160.0,110.0 A 50,50 0 0 0 150.45,80.61 Z',fill:'#639922'}
  ];
  const veloEl=document.getElementById('velo');
  const sld=document.getElementById('sld'), sldv=document.getElementById('sldv');
  const fmt=v=>v.toFixed(1).replace('.',',');
  function render(rating){
    const rc=Math.max(0.5,Math.min(5,rating));
    const angle=180-(rc-0.5)*36, rad=angle*Math.PI/180;
    const tipX=(110+80*Math.cos(rad)).toFixed(2), tipY=(110-80*Math.sin(rad)).toFixed(2);
    const si=Math.min(5,Math.max(1,Math.floor(rc-0.5)+1)), st=STATES[si-1];
    let paths=''; slices.forEach(s=>{paths+='<path d="'+s.d+'" fill="'+s.fill+'"/>';});
    // 0 e 5 no miolo branco, alinhados à base da faixa e perto das pontas internas (cinza)
    const scale='<text x="66" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa5be" style="font-family:var(--font)">0</text>'
              +'<text x="154" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#9aa5be" style="font-family:var(--font)">5</text>';
    const needle='<line x1="110" y1="110" x2="'+tipX+'" y2="'+tipY+'" stroke="#042C53" stroke-width="3.5" stroke-linecap="round"/>'
               +'<circle cx="110" cy="110" r="7" fill="#042C53"/><circle cx="110" cy="110" r="3" fill="#fff"/>';
    const svg='<svg viewBox="0 6 220 124" width="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doxcore '+fmt(rating)+' de 5 — '+st.w+'">'
            +paths+scale+needle+'</svg>';
    veloEl.innerHTML='<div class="velo-word" style="font-size:18px;color:'+st.d+'">'+st.w+'</div>'
            +svg+'<div class="velo-score" style="font-size:44px">'+fmt(rating)+'</div>';
    sldv.textContent=fmt(rating);
  }
  sld.addEventListener('input',()=>render(parseFloat(sld.value)));
  render(parseFloat(sld.value));
})();
</script>
</body>
</html>
